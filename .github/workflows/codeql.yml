name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, stable]
  schedule:
    - cron: "20 2 * * 2"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # docs-only PRs don't need a CodeQL database build + analysis. `code`
      # is true iff at least one changed file is NOT a .md/.mdx. On
      # `schedule` (no diff to compare) paths-filter has no base to work
      # from and evaluates every filter to true, so the weekly full scan is
      # unaffected. The job still runs and reports "Analyze Python" quickly
      # either way, so this required check never hangs pending.
      - name: Detect docs-only change
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!**/*.mdx'

      - name: Initialize CodeQL
        if: steps.filter.outputs.code == 'true'
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: python

      - name: Perform CodeQL analysis
        if: steps.filter.outputs.code == 'true'
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
